version: 1
targets:
  claude:
    path: ~/.claude/skills
    method: symlink
    enabled: true
  codex:
    path: ~/.agents/skills
    method: symlink
    enabled: true
  omp:
    path: ~/.omp/skills
    method: symlink
    enabled: true
policies: {}
skills:
  recap:
    path: skills/recap
    expose: [claude, codex]
  resume-session:
    path: skills/resume-session
    expose: [claude, codex]
  setup-file-based-context:
    path: skills/setup-file-based-context
    expose: [claude, codex]
  oracle-research:
    path: skills/oracle-research
    expose: [claude, codex]
  obsidian-cli:
    path: skills/obsidian-cli
    # claude 노출 제거: obsidian 플러그인(obsidian:obsidian-cli)과 완전 동일 내용 이중 등록이었음.
    # codex에는 해당 플러그인이 없으므로 codex 노출은 유지.
    expose: [codex]
  backlog:
    path: skills/backlog
    expose: [claude, codex]
  bb-cli:
    path: skills/bb-cli
    expose: [claude, codex]
  github-autopilot:
    path: skills/github-autopilot
    expose: [claude, codex, omp]
  herdr-orchestration:
    path: skills/herdr-orchestration
    expose: [claude, codex, omp]
  herdr:
    path: skills/herdr
    expose: [claude, codex, omp]
  jira-autopilot:
    path: skills/jira-autopilot
    expose: [claude, codex]
  setup-github-issue-based-context:
    path: skills/setup-github-issue-based-context
    expose: [claude, codex]
  explain-diff-html:
    path: skills/explain-diff-html
    expose: [claude]
  explain-changes:
    path: skills/explain-changes
    expose: [claude]
  explain-quiz:
    path: skills/explain-quiz
    expose: [claude]
  explain-playground:
    path: skills/explain-playground
    expose: [claude]
  # codex-first:
  #   path: skills/codex-first
  #   expose: [claude]
  autoresearch:
    path: skills/autoresearch
    expose: [claude]
