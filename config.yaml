version: 1
targets:
  claude:
    path: ~/.claude/skills
    method: symlink
    enabled: true
  codex:
    path: ~/.agents/skills
    method: symlink
    enabled: true
  omp:
    path: ~/.omp/skills
    method: symlink
    enabled: true
policies: {}
skills:
  recap:
    path: skills/recap
    expose: [claude, codex]
  resume-session:
    path: skills/resume-session
    # claude 노출 제거: 2026-07~08 트랜스크립트 92개에서 호출 0회이고, 같은 목적의 recap이
    # claude에 남아 있다. codex에서는 이름이 session-resume(variants/codex frontmatter)이라 유지.
    expose: [codex]
  setup-file-based-context:
    path: skills/setup-file-based-context
    expose: [claude, codex]
  oracle-research:
    path: skills/oracle-research
    # claude 노출 제거: 2026-07~08 트랜스크립트 92개에서 호출 0회. description 528자로
    # 매 세션 비용이 큰 편이라 실사용이 확인되면 다시 올린다.
    expose: [codex]
  obsidian-cli:
    path: skills/obsidian-cli
    # claude 노출 제거: obsidian 플러그인(obsidian:obsidian-cli)과 완전 동일 내용 이중 등록이었음.
    # codex에는 해당 플러그인이 없으므로 codex 노출은 유지.
    expose: [codex]
  bb-cli:
    path: skills/bb-cli
    # claude 노출 제거: lxp_services가 .claude/skills/bb-cli로 자체 버전을 가지며, 그쪽에만
    # 실측 함정(pr comments --all, pr diff 플래그, write:pipeline 403)이 들어 있다. 같은 이름을
    # 글로벌로 노출하면 프로젝트판을 가린다. codex는 프로젝트 스킬을 읽지 않으므로 노출 유지.
    expose: [codex]
  github-autopilot:
    path: skills/github-autopilot
    expose: [claude, codex, omp]
  herdr-orchestration:
    path: skills/herdr-orchestration
    expose: [claude, codex, omp]
  herdr:
    path: skills/herdr
    expose: [claude, codex, omp]
  codex-review:
    path: skills/codex-review
    # claude 전용: Claude Code가 codex를 리뷰어로 부르는 어댑터라 codex/omp에는 의미 없음.
    expose: [claude]
  jira-autopilot:
    path: skills/jira-autopilot
    # claude 노출 제거: lxp_services의 .claude/skills/jira-autopilot이 AC 프로젝트 워크플로와
    # Codex 게이트 판정을 담고 있어 그쪽이 정본이다. codex는 프로젝트 스킬을 읽지 않으므로 유지.
    expose: [codex]
  setup-github-issue-based-context:
    path: skills/setup-github-issue-based-context
    # claude 노출 제거: 레포당 한 번 실행하는 부트스트랩이라 상주 비용 대비 발동 빈도가 낮다.
    # 필요할 때 expose에 claude를 다시 넣고 skillctl apply 하면 된다.
    expose: [codex]
  # explain-diff-html: 항목 제거. claude가 유일한 노출 대상이었고, lxp_services의
  # .claude/skills/explain-diff-html이 저장 위치(docs/agentic-coding/<TICKET-KEY>.html)와
  # 한국어 본문 규칙을 담은 정본이다. skills/explain-diff-html 소스는 남겨 둔다.
  explain-changes:
    path: skills/explain-changes
    expose: [claude]
  # 아래 세 항목은 expose를 비워 보류 상태로 둔다(항목 자체는 남긴다 — 그래야 skills/ 아래
  # 소스가 고아로 보여 삭제되지 않는다). 대체본이 다른 데 있어 항목을 지운 explain-diff-html과
  # 다른 경우다.
  explain-quiz:
    path: skills/explain-quiz
    # claude 노출 보류: 설명 흐름의 실사용 경로는 lxp_services의 explain-diff-html이고(2026-07~08
    # 호출 3회), 퀴즈는 그 문서의 부속 단계라 상주시킬 이유가 약하다.
    expose: []
  explain-playground:
    path: skills/explain-playground
    # claude 노출 보류: explain-quiz와 같은 이유. 대화형 HTML 산출은 explain-diff-html로 커버된다.
    expose: []
  autoresearch:
    path: skills/autoresearch
    # claude 노출 보류: 측정 가능한 지표를 두고 반복 최적화할 때만 쓰는 루프인데 그런 작업이
    # 아직 없었다. description 538자로 노출 스킬 중 최대라 비용 대비 효용이 가장 낮다.
    expose: []
  humanizer:
    # 업스트림: https://github.com/blader/humanizer (MIT). SKILL.md만 복사한 vendored 사본.
    # 갱신은 업스트림 SKILL.md 재복사 + metadata.version 확인.
    path: skills/humanizer
    # claude 노출 제거: 글쓰기 교정 전용이라 이 레포의 코드 작업 흐름에서 발동하지 않는다.
    expose: [codex, omp]
